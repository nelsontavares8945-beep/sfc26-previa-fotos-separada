<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFC 26 — prévia</title></head><body><p id="status">Carregando SFC 26...</p><script>(async()=>{try{if(!window.DecompressionStream)throw Error("Navegador incompatível. Atualize seu navegador.");let files=await Promise.all(Array.from({length:43},(_,i)=>fetch(`part${String(i).padStart(2,"0")}.txt`).then(r=>{if(!r.ok)throw Error("Falha ao carregar os dados do jogo");return r.text()})));let raw=Uint8Array.from(atob(files.join("")),c=>c.charCodeAt(0));let html=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById("status").textContent="Não foi possível iniciar o jogo: "+e.message}})();</script></body></html>
